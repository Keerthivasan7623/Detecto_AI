services:
  safetyvision-ai:
    build:
      context: .
      dockerfile: Dockerfile
    image: safetyvision-ai:latest
    container_name: safetyvision_ai_app
    ports:
      - "8501:8501"
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    env_file:
      - path: .env
        required: false
    volumes:
      # Persistent SQLite database storage (bind-mount to preserve existing data)
      - ./SafetyVision_AI_Milestone1/safety.db:/app/safety.db
      # Persistent storage for evidence crops, annotated media, and generated PDF/CSV audit reports
      - ./SafetyVision_AI_Milestone1/outputs:/app/outputs
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8501/_stcore/health\").read()' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
